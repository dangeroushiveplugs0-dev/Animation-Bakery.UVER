name: Android Creator APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Patch Android navigation insets
        run: |
          MAIN="$(find android/app/src/main/java -name MainActivity.java | head -n 1)"
          cat > "$MAIN" <<'EOF'
          package com.dangeroushive.animationbakery.uver;

          import android.os.Bundle;
          import android.os.Bundle;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              enterImmersive();
            }

            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) enterImmersive();
            }

            private void enterImmersive() {
              WindowCompat.setDecorFitsSystemWindows(getWindow(), true);
              WindowInsetsControllerCompat controller =
                  WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
              if (controller == null) return;
              controller.setSystemBarsBehavior(
                  WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              controller.hide(WindowInsetsCompat.Type.navigationBars());
              controller.hide(WindowInsetsCompat.Type.statusBars());
            }
          }
          EOF
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animation-Bakery-UVER-0.1.8
          path: android/app/build/outputs/apk/debug/app-debug.apk