name: Android Creator APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Patch Android navigation insets
        run: |
          MAIN="$(find android/app/src/main/java -name MainActivity.java | head -n 1)"
          cat > "$MAIN" <<'EOF'
          package com.dangeroushive.animationbakery.uver;

          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import androidx.core.graphics.Insets;
          import androidx.core.view.ViewCompat;
          import androidx.core.view.WindowInsetsCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onResume() {
              super.onResume();
              View webView = getBridge().getWebView();
              if (webView == null) return;
              ViewCompat.setOnApplyWindowInsetsListener(webView, (view, insets) -> {
                Insets navigation = insets.getInsetsIgnoringVisibility(WindowInsetsCompat.Type.navigationBars());
              webView.setSystemUiVisibility(webView.getSystemUiVisibility());
                ViewGroup.LayoutParams raw = view.getLayoutParams();
                if (raw instanceof ViewGroup.MarginLayoutParams) {
                  ViewGroup.MarginLayoutParams params = (ViewGroup.MarginLayoutParams) raw;
                  if (params.bottomMargin != navigation.bottom) {
                    params.bottomMargin = navigation.bottom;
                    view.setLayoutParams(params);
                  }
                }
                return insets;
              });
              ViewCompat.requestApplyInsets(webView);
            }
          }
          EOF
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Animation-Bakery-UVER-0.1.7
          path: android/app/build/outputs/apk/debug/app-debug.apk